{% extends 'menu/base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="mt-7 px-6 py-14 bg-gray-100 rounded-lg shadow-md">
    <h2 class="mb-10 text-2xl text-center text-gray-700">Our Dishes</h2>

    <div class="grid grid-cols-3 gap-8">
        {% for item in items %}
            <div class="border border-gray-200 rounded-lg overflow-hidden hover:shadow-lg transform hover:scale-105 transition duration-300 ease-in-out">
                <a href="{% url 'item:detail' item.id %}">
                    <div>
                        <img src="{{ item.image.url }}" class="w-full h-48 object-cover"
                        >
                    </div>

                    <div class="p-4 bg-white">
                        <h2 class="text-xl font-semibold text-gray-800">{{ item.name }}</h2>
                        <p class="text-gray-600 mt-1">Price: {{ item.price }}</p>
                    </div>
                </a>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
